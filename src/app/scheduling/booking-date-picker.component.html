<div class="relative">
  <button
    type="button"
    (click)="opened = !opened"
    [disabled]="disabled"
    class="w-full p-3 border rounded-xl text-left"
    style="background: var(--bg-primary); border-color: var(--border-color)"
  >
    {{ date || 'Selecciona una fecha de atención' }}
  </button>
  @if (opened) {
    <div
      class="p-4 rounded-2xl border shadow-xl mt-2"
      style="background: var(--bg-secondary); border-color: var(--border-color)"
    >
      <div class="flex items-center justify-between mb-3">
        <button type="button" (click)="shift(-1)" aria-label="Mes anterior">‹</button
        ><strong>{{ monthLabel() }}</strong
        ><button type="button" (click)="shift(1)" aria-label="Mes siguiente">›</button>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center text-xs">
        @for (day of ['L', 'M', 'X', 'J', 'V', 'S', 'D']; track $index) {
          <span>{{ day }}</span>
        }
        @for (day of cells(); track $index) {
          @if (day) {
            <button
              type="button"
              (click)="choose(day.date)"
              [disabled]="!allowed(day.date)"
              class="rounded-lg p-2 disabled:opacity-25 disabled:cursor-not-allowed disabled:line-through enabled:hover:bg-blue-500/20"
              [class.bg-blue-500]="day.date === date"
              [attr.aria-label]="
                day.date + ' ' + (allowed(day.date) ? 'disponible' : 'cerrado o sin horarios')
              "
            >
              {{ day.number }}
            </button>
          } @else {
            <span></span>
          }
        }
      </div>
      <p class="text-[10px] mt-2">
        Solo se habilitan días con horarios de atención disponibles para la duración elegida.
      </p>
    </div>
  }
</div>
