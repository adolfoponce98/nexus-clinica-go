<button
  #trigger
  type="button"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  class="date-trigger"
  (click)="toggle()"
  [disabled]="disabled"
  aria-haspopup="dialog"
  [attr.aria-expanded]="opened"
  [attr.aria-controls]="opened ? panelId : null"
>
  <lucide-icon [img]="icons.CalendarDays" [size]="16" aria-hidden="true" />
  <span>{{ dateLabel }}</span
  ><lucide-icon [img]="icons.ChevronDown" [size]="14" aria-hidden="true" />
</button>
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="opened"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="12"
  (backdropClick)="close()"
  (overlayKeydown)="overlayKeydown($event)"
>
  <section
    class="date-popover"
    [id]="panelId"
    role="dialog"
    aria-modal="true"
    aria-label="Seleccionar fecha de la cita"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
  >
    <header class="date-heading">
      <span><lucide-icon [img]="icons.CalendarDays" [size]="16" />Fecha de la cita</span>
      <button
        type="button"
        class="date-icon"
        aria-label="Cerrar selector de fecha"
        (click)="close()"
      >
        <lucide-icon [img]="icons.X" [size]="16" />
      </button>
    </header>
    <div class="date-navigation">
      <button type="button" class="date-icon" (click)="shift(-1)" aria-label="Mes anterior">
        <lucide-icon [img]="icons.ChevronLeft" [size]="17" />
      </button>
      <strong aria-live="polite">{{ monthLabel() }}</strong>
      <button type="button" class="date-icon" (click)="shift(1)" aria-label="Mes siguiente">
        <lucide-icon [img]="icons.ChevronRight" [size]="17" />
      </button>
    </div>
    <div class="date-grid">
      @for (day of ['L', 'M', 'X', 'J', 'V', 'S', 'D']; track $index) {
        <span class="weekday">{{ day }}</span>
      }
      @for (day of cells(); track $index) {
        @if (day) {
          <button
            type="button"
            class="date-day"
            (click)="choose(day.date)"
            [disabled]="!allowed(day.date)"
            [class.selected]="day.date === date"
            [attr.aria-pressed]="day.date === date"
            [attr.aria-label]="
              day.date + ' ' + (allowed(day.date) ? 'disponible' : 'cerrado o sin horarios')
            "
          >
            {{ day.number }}
          </button>
        } @else {
          <span></span>
        }
      }
    </div>
    <p class="date-hint">
      Solo se muestran disponibles los días con horarios de atención para la duración elegida.
    </p>
  </section>
</ng-template>
