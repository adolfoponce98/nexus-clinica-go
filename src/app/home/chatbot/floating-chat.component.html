<!-- Botón flotante en la esquina inferior derecha -->
<div class="fixed bottom-6 right-6 z-50">
  <button
    (click)="toggleChat()"
    class="bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-full shadow-2xl flex items-center justify-center transition-transform hover:scale-105 focus:outline-none"
  >
    <!-- Icono de Chat SVG -->
    <svg
      *ngIf="!isOpen"
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
      />
    </svg>
    <!-- Icono de Cerrar SVG -->
    <svg
      *ngIf="isOpen"
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M6 18L18 6M6 6l12 12"
      />
    </svg>
  </button>
</div>

<!-- Ventana de Chat Flotante -->
<div
  *ngIf="isOpen"
  class="fixed bottom-24 right-6 w-96 max-w-[calc(100vw-3rem)] h-[500px] max-h-[calc(100dvh-8rem)] bg-white rounded-2xl shadow-2xl border border-gray-200 z-50 flex flex-col overflow-hidden animate-fade-in"
>
  <!-- Cabecera del Chat -->
  <div class="bg-blue-600 text-white p-4 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-3">
      <div class="relative">
        <div
          class="w-3 h-3 bg-green-400 rounded-full absolute bottom-0 right-0 border-2 border-white"
        ></div>
        <div
          class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center font-bold text-lg"
        >
          🤖
        </div>
      </div>
      <div>
        <h3 class="font-semibold text-sm">Asistente Médico de Soporte</h3>
        <p class="text-xs text-blue-100">En línea para reportes</p>
      </div>
    </div>
    <button (click)="toggleChat()" class="text-blue-100 hover:text-white focus:outline-none">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>

  <!-- Cuerpo de mensajes -->
  <div #scrollContainer class="min-w-0 flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50">
    <div
      *ngFor="let msg of messages"
      [ngClass]="{
        'flex justify-end': msg.sender === 'doctor',
        'flex justify-start': msg.sender === 'bot',
      }"
    >
      <div
        [ngClass]="{
          'bg-blue-600 text-white rounded-l-xl rounded-tr-xl': msg.sender === 'doctor',
          'bg-white text-gray-800 border border-gray-200 rounded-r-xl rounded-tl-xl':
            msg.sender === 'bot',
        }"
        class="max-w-[75%] p-3 shadow-sm text-sm"
      >
        <p>{{ msg.text }}</p>
        <span
          [ngClass]="{
            'text-blue-100': msg.sender === 'doctor',
            'text-gray-400': msg.sender === 'bot',
          }"
          class="block text-[10px] text-right mt-1"
        >
          {{ msg.time }}
        </span>
      </div>
    </div>
  </div>

  <!-- Pie de entrada de texto -->
  <div class="p-3 bg-white border-t border-gray-200 flex items-center space-x-2">
    <input
      type="text"
      [(ngModel)]="newMessage"
      (keyup.enter)="sendMessage()"
      placeholder="Escribe tu incidente o pregunta..."
      class="min-w-0 flex-1 border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-blue-500"
    />

    <button
      (click)="sendMessage()"
      class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-full transition-colors focus:outline-none"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 rotate-90"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
        />
      </svg>
    </button>
  </div>
</div>
