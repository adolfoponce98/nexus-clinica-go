<div class="min-h-screen font-sans p-6 sm:p-8 space-y-8" style="background-color: var(--bg-primary); color: var(--text-main);">

  <!-- ENCABEZADO -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <p class="text-xs font-bold uppercase tracking-widest" style="color: var(--text-muted);">Panel de control</p>
      <h1 class="text-2xl sm:text-3xl font-black tracking-tight flex items-center gap-2" style="color: var(--text-main);">
        Hola, Dra. Ana <span>👋</span>
      </h1>
      <p class="text-xs mt-0.5" style="color: var(--text-muted);">Aquí tienes un resumen de tu día y de tu práctica.</p>
    </div>

    <div class="flex items-center gap-3 px-4 py-2.5 rounded-2xl shadow-lg" style="background-color: var(--bg-secondary); border: 1px solid var(--border-color);">
      <lucide-icon [img]="icons.Calendar" class="w-4 h-4 text-blue-500"></lucide-icon>
      <span class="text-xs font-bold" style="color: var(--text-main);">{{ currentDateText }}</span>
    </div>
  </div>

  <!-- GRID PRINCIPAL DE CONTENIDO -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

    <!-- COLUMNA IZQUIERDA Y CENTRAL -->
    <div class="lg:col-span-2 space-y-8">

      <!-- FILA 1: MÉTRICAS SUPERIORES (4 CARDS) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">

        <div class="p-5 rounded-3xl shadow-xl flex flex-col justify-between transition-all" style="background-color: var(--bg-secondary); border: 1px solid var(--border-color);">
          <div class="flex justify-between items-start">
            <div class="w-10 h-10 bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 rounded-2xl flex items-center justify-center">
              <lucide-icon [img]="icons.Calendar" class="w-5 h-5"></lucide-icon>
            </div>
            <lucide-icon [img]="icons.ChevronRight" class="w-4 h-4" style="color: var(--text-muted);"></lucide-icon>
          </div>
          <div class="my-4">
            <p class="text-[10px] font-bold uppercase tracking-wider" style="color: var(--text-muted);">Citas de hoy</p>
            <h3 class="text-3xl font-black mt-1" style="color: var(--text-main);">12</h3>
            <p class="text-[10px] mt-1" style="color: var(--text-muted);">8 confirmadas • 4 por confirmar</p>
          </div>
        </div>

        <div class="p-5 rounded-3xl shadow-xl flex flex-col justify-between transition-all" style="background-color: var(--bg-secondary); border: 1px solid var(--border-color);">
          <div class="flex justify-between items-start">
            <div class="w-10 h-10 bg-blue-500/10 text-blue-500 border border-blue-500/20 rounded-2xl flex items-center justify-center">
              <lucide-icon [img]="icons.Users" class="w-5 h-5"></lucide-icon>
            </div>
            <lucide-icon [img]="icons.ChevronRight" class="w-4 h-4" style="color: var(--text-muted);"></lucide-icon>
          </div>
          <div class="my-4">
            <p class="text-[10px] font-bold uppercase tracking-wider" style="color: var(--text-muted);">Pacientes activos</p>
            <h3 class="text-3xl font-black mt-1" style="color: var(--text-main);">248</h3>
            <p class="text-[10px] text-emerald-500 font-bold mt-1">+12% vs. mes anterior</p>
          </div>
        </div>

        <div class="p-5 rounded-3xl shadow-xl flex flex-col justify-between transition-all" style="background-color: var(--bg-secondary); border: 1px solid var(--border-color);">
          <div class="flex justify-between items-start">
            <div class="w-10 h-10 bg-indigo-500/10 text-indigo-500 border border-indigo-500/20 rounded-2xl flex items-center justify-center">
              <lucide-icon [img]="icons.FileText" class="w-5 h-5"></lucide-icon>
            </div>
            <lucide-icon [img]="icons.ChevronRight" class="w-4 h-4" style="color: var(--text-muted);"></lucide-icon>
          </div>
          <div class="my-4">
            <p class="text-[10px] font-bold uppercase tracking-wider" style="color: var(--text-muted);">Expedientes</p>
            <h3 class="text-3xl font-black mt-1" style="color: var(--text-main);">248</h3>
            <p class="text-[10px] mt-1" style="color: var(--text-muted);">Total en el sistema</p>
          </div>
        </div>

        <div class="p-5 rounded-3xl shadow-xl flex flex-col justify-between transition-all" style="background-color: var(--bg-secondary); border: 1px solid var(--border-color);">
          <div class="flex justify-between items-start">
            <div class="w-10 h-10 bg-rose-500/10 text-rose-500 border border-rose-500/20 rounded-2xl flex items-center justify-center">
              <lucide-icon [img]="icons.AlertCircle" class="w-5 h-5"></lucide-icon>
            </div>
            <lucide-icon [img]="icons.ChevronRight" class="w-4 h-4" style="color: var(--text-muted);"></lucide-icon>
          </div>
          <div class="my-4">
            <p class="text-[10px] font-bold uppercase tracking-wider" style="color: var(--text-muted);">Pendientes por revisar</p>
            <h3 class="text-3xl font-black mt-1" style="color: var(--text-main);">5</h3>
            <p class="text-[10px] mt-1" style="color: var(--text-muted);">Resultados / Estudios</p>
          </div>
        </div>

      </div>

      <!-- FILA 2: GRÁFICAS MODULARIZADAS -->
      <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
         <app-quick-actions [actions]="quickActions" (actionClicked)="triggerAction($event)" />

   <app-patient-evolution [data]="patientEvolutionDataMap" />
      </div>

      <!-- FILA 3: ÚLTIMOS PACIENTES & ACCIONES RÁPIDAS -->
      <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
           <app-reminders [reports]="reportsList" />
         <app-specialty-chart [data]="specialtyData" />
      </div>

    </div>

    <!-- COLUMNA DERECHA -->
    <div class="space-y-6">
      <app-upcoming-appointments [appointments]="upcomingAppointments" />
       <app-recent-patients [patients]="recentPatients" />
         <app-reminders [reports]="reportsList" />



    </div>

  </div>
</div>
