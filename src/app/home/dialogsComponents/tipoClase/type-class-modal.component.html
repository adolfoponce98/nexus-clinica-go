@if (isOpen) {
  <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-md">
    <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-4xl max-h-[90vh] overflow-y-auto shadow-2xl grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- Lado Izquierdo: Formulario -->
      <div>
        <h3 class="text-xl font-black mb-6 uppercase">Nuevo Tipo de Clase</h3>
        <form [formGroup]="typeClassForm" (ngSubmit)="onSave()" class="space-y-4">
          <input formControlName="name" placeholder="Nombre (ej. Power Spin)" class="w-full bg-zinc-50 p-4 rounded-xl text-sm font-bold outline-none">
          <textarea formControlName="descripcion" placeholder="Descripción" class="w-full bg-zinc-50 p-4 rounded-xl text-sm font-bold outline-none"></textarea>
          <input formControlName="duracion" placeholder="Duración (ej. 45 min)" class="w-full bg-zinc-50 p-4 rounded-xl text-sm font-bold outline-none">
          
          <label class="text-[10px] font-black uppercase text-zinc-400">Dificultad</label>
          <div class="grid grid-cols-4 gap-2">
            @for (d of [1,2,3,4]; track d) {
              <button type="button" (click)="typeClassForm.patchValue({dificultad: d})" 
                      [class]="typeClassForm.value.dificultad === d ? getDificultadColor(d) + ' text-white' : 'bg-zinc-100'"
                      class="py-2 rounded-lg text-[9px] font-black uppercase transition-all">
                {{ d === 1 ? 'Fácil' : d === 2 ? 'Media' : d === 3 ? 'Retadora' : 'Difícil' }}
              </button>
            }
          </div>
          <button type="submit" class="w-full bg-rose-500 text-white font-black py-4 rounded-xl uppercase tracking-widest text-xs mt-4">Guardar Clase</button>
        </form>
      </div>

      <!-- Lado Derecho: Lista -->
      <div class="bg-zinc-50 p-6 rounded-3xl border border-zinc-100">
        <h4 class="text-sm font-black uppercase mb-4">Clases Agregadas</h4>
        <div class="space-y-3">
          @for (tc of typeClasses(); track $index) {
            <div class="bg-white p-4 rounded-xl border flex justify-between items-center shadow-sm">
              <div>
                <p class="font-black text-xs">{{ tc['name'] }}</p>
                <p class="text-[9px] text-zinc-400">{{ tc['duracion'] }} • <span [class]="getDificultadColor(tc['dificultad'])" class="w-2 h-2 rounded-full inline-block"></span></p>
              </div>
              <button (click)="deleteItem($index)" class="text-zinc-300 hover:text-rose-500 cursor-pointer"><lucide-icon [img]="icons.X" class="w-4 h-4"></lucide-icon></button>
            </div>
          }
        </div>
      </div>
      <button (click)="onClose()" class="md:col-span-2 text-zinc-400 underline text-xs font-bold cursor-pointer">Cerrar</button>
    </div>
  </div>
}
