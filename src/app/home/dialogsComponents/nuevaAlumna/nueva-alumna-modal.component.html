<!-- ================= 1. MODAL DEL FORMULARIO (Se oculta si hay un popup activo) ================= -->
@if (isOpen && !showSuccessPopup && !showErrorPopup) {
  <div class="fixed inset-0 z-40 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-zinc-950/40 backdrop-blur-sm" (click)="cerrarModal()"></div>
    <div class="relative bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl shadow-zinc-950/20 z-10 animate-in slide-in-from-bottom-4 duration-300">
      <button (click)="cerrarModal()" class="absolute right-6 top-6 text-zinc-300 hover:text-zinc-500 cursor-pointer">
        <lucide-icon [img]="X" class="w-5 h-5"></lucide-icon>
      </button>

      <h3 class="text-xl font-black text-zinc-900 uppercase tracking-tighter mb-6">
        {{ isEditing ? 'Editar Alumna' : 'Nueva Alumna' }}
      </h3>

      <div class="space-y-4">
        <div>
          <label class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 mb-1 block">Nombre completo</label>
          <input        placeholder="Ej. Pablo Ramirez" type="text" [(ngModel)]="formStudent.name" class="w-full bg-zinc-50 border border-zinc-200 rounded-2xl px-4 py-3 text-sm font-bold text-zinc-800 focus:outline-none focus:border-rose-500" />
        </div>
        <div>
          <label class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 mb-1 block">Teléfono</label>
      <input type="text"
       [(ngModel)]="formStudent.phone"
       (input)="formStudent.phone = $any($event.target).value.replace(/[^0-9]/g, '').slice(0, 10)"
       maxlength="10"
       placeholder="Ej. 3312345678"
       class="w-full bg-zinc-50 border border-zinc-200 rounded-2xl px-4 py-3 text-sm font-bold text-zinc-800 focus:outline-none focus:border-rose-500" /> </div>
        <div>
          <label class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 mb-1 block">Correo Electrónico</label>
          <input        placeholder="Ej. usuario@gmail.com"  type="email" [(ngModel)]="formStudent.email" class="w-full bg-zinc-50 border border-zinc-200 rounded-2xl px-4 py-3 text-sm font-bold text-zinc-800 focus:outline-none focus:border-rose-500" />
        </div>
        <div>
          <label class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 mb-1 block">Contraseña</label>
          <input type="text" [(ngModel)]="formStudent.password" class="w-full bg-zinc-50 border border-zinc-200 rounded-2xl px-4 py-3 text-sm font-bold text-zinc-800 focus:outline-none focus:border-rose-500" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 w-full mt-8">
        <button (click)="cerrarModal()" class="py-4 rounded-2xl text-xs font-black uppercase tracking-widest text-zinc-400 bg-zinc-50 hover:bg-zinc-100 transition-all cursor-pointer">Cancelar</button>
        <button (click)="guardarAlumno()" [disabled]="isLoading" class="py-4 rounded-2xl text-xs font-black uppercase tracking-widest text-white bg-rose-500 hover:bg-rose-600 shadow-lg shadow-rose-500/30 transition-all cursor-pointer flex items-center justify-center disabled:opacity-50">
          @if (isLoading) {
            <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          } @else {
            {{ isEditing ? 'Guardar Cambios' : 'Registrar' }}
          }
        </button>
      </div>
    </div>
  </div>
}

<!-- ================= 2. POPUP DE ÉXITO (Z-index superior para flotar al frente) ================= -->
@if (showSuccessPopup) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-zinc-950/60 backdrop-blur-md" (click)="finalizarTodo()"></div>

    <div class="relative bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl shadow-zinc-950/30 z-50 animate-in zoom-in-95 duration-200 text-center">
      <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-inner">
        <lucide-icon [img]="CheckCircle2" class="w-8 h-8"></lucide-icon>
      </div>

      <h3 class="text-xl font-black text-zinc-900 uppercase tracking-tighter mb-2">¡Operación Exitosa!</h3>
      <p class="text-xs font-medium text-zinc-500 leading-relaxed mb-6">
        La alumna se ha guardado correctamente en el sistema.
      </p>

      <button (click)="finalizarTodo()" class="w-full bg-zinc-950 hover:bg-zinc-800 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs transition-all cursor-pointer shadow-lg shadow-zinc-950/20">
        Entendido
      </button>
    </div>
  </div>
}

<!-- ================= 3. POPUP DE ERROR (Z-index superior para flotar al frente) ================= -->
@if (showErrorPopup) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-zinc-950/60 backdrop-blur-md" (click)="showErrorPopup = false"></div>

    <div class="relative bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl shadow-zinc-950/30 z-50 animate-in zoom-in-95 duration-200 text-center">
      <div class="w-16 h-16 bg-rose-50 text-rose-500 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-inner">
        <lucide-icon [img]="AlertCircle" class="w-8 h-8"></lucide-icon>
      </div>

      <h3 class="text-xl font-black text-zinc-900 uppercase tracking-tighter mb-2">Error de Registro</h3>
      <p class="text-xs font-medium text-zinc-500 leading-relaxed mb-6">
        {{ errorMessage }}
      </p>

      <button (click)="showErrorPopup = false" class="w-full bg-zinc-950 hover:bg-zinc-800 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs transition-all cursor-pointer shadow-lg shadow-zinc-950/20">
        Intentar de nuevo
      </button>
    </div>
  </div>
}
