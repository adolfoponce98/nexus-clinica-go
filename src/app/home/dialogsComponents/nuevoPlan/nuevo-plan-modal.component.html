@if (isOpen) {
  <div class="app-dialog-overlay fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Fondo oscuro difuminado -->
    <div class="absolute inset-0 bg-zinc-950/50 backdrop-blur-sm" (click)="cerrarModal()"></div>

    <!-- Contenedor del Modal -->
    <div
      class="relative bg-white w-full max-w-lg rounded-[32px] p-8 shadow-2xl shadow-zinc-950/20 z-10 animate-in zoom-in-95 duration-200"
    >
      <!-- Botón Cerrar -->
      <button
        (click)="cerrarModal()"
        class="absolute right-6 top-6 w-10 h-10 bg-zinc-50 hover:bg-zinc-100 rounded-full flex items-center justify-center text-zinc-400 hover:text-zinc-700 transition-all cursor-pointer font-black"
      >
        <lucide-icon [img]="X" class="w-5 h-5"></lucide-icon>
      </button>

      <h3 class="text-xl font-black text-zinc-900 uppercase tracking-tighter mb-6">
        Crear Nuevo Plan
      </h3>

      <div class="space-y-6">
        <div class="space-y-2">
          <label class="text-[9px] font-bold uppercase tracking-widest text-zinc-400"
            >Nombre del Plan</label
          >
          <input
            type="text"
            [ngModel]="newPlan().name"
            (ngModelChange)="newPlan.update(p => ({ ...p, name: $event }))"
            placeholder="Ej: Platinum Monthly"
            class="w-full border-b border-zinc-100 py-2 font-bold text-zinc-900 outline-none focus:border-rose-500 transition-colors"
          />
        </div>

        <div class="space-y-2">
          <label class="text-[9px] font-bold uppercase tracking-widest text-zinc-400"
            >Descripción</label
          >
          <input
            type="text"
            [ngModel]="newPlan().descripcion"
            (ngModelChange)="newPlan.update(p => ({ ...p, descripcion: $event }))"
            placeholder="Detalles del paquete..."
            class="w-full border-b border-zinc-100 py-2 font-bold text-zinc-900 outline-none focus:border-rose-500 transition-colors"
          />
        </div>

        <div class="grid grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="text-[9px] font-bold uppercase tracking-widest text-zinc-400"
              >Precio Regular (MXN)</label
            >
            <input
              type="number"
              [ngModel]="newPlan().precioRegular"
              (ngModelChange)="newPlan.update(p => ({ ...p, precioRegular: $event }))"
              class="w-full border-b border-zinc-100 py-2 font-bold text-zinc-900 outline-none"
            />
          </div>
          <div class="space-y-2">
            <label class="text-[9px] font-bold uppercase tracking-widest text-zinc-400"
              >Créditos</label
            >
            <input
              type="number"
              [ngModel]="newPlan().creditos"
              (ngModelChange)="newPlan.update(p => ({ ...p, creditos: $event }))"
              placeholder="10"
              class="w-full border-b border-zinc-100 py-2 font-bold text-zinc-900 outline-none"
            />
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-[9px] font-bold uppercase tracking-widest text-zinc-400"
            >Tipo de Membresía</label
          >
          <div class="grid grid-cols-2 bg-zinc-50 p-1 rounded-xl">
            <button
              (click)="newPlan.update(p => ({ ...p, tipoMmebresia: 1 }))"
              [class]="
                newPlan().tipoMmebresia === 1 ? 'bg-white shadow-sm text-zinc-900' : 'text-zinc-400'
              "
              class="py-2 rounded-lg text-[10px] font-black uppercase transition-all cursor-pointer"
            >
              Paquete (1)
            </button>
            <button
              (click)="newPlan.update(p => ({ ...p, tipoMmebresia: 2 }))"
              [class]="
                newPlan().tipoMmebresia === 2 ? 'bg-white shadow-sm text-zinc-900' : 'text-zinc-400'
              "
              class="py-2 rounded-lg text-[10px] font-black uppercase transition-all cursor-pointer"
            >
              Suscripción (2)
            </button>
          </div>
        </div>

        <!-- Switch de Visibilidad -->
        <div class="space-y-2 pt-2">
          <label class="text-[9px] font-bold uppercase tracking-widest text-zinc-400"
            >Visibilidad</label
          >
          <div class="flex items-center justify-between bg-zinc-50 p-4 rounded-xl">
            <span class="text-xs font-bold text-zinc-700">Mostrar paquete al usuario</span>
            <input
              type="checkbox"
              [ngModel]="newPlan().visibleParaUsuario"
              (ngModelChange)="newPlan.update(p => ({ ...p, visibleParaUsuario: $event }))"
              class="w-4 h-4 accent-rose-500 rounded cursor-pointer"
            />
          </div>
        </div>

        <div class="pt-4">
          <button
            (click)="savePlan()"
            [appPermissionDisabled]="isLoading"
            class="w-full bg-zinc-950 text-white font-black py-4 rounded-2xl uppercase text-[10px] tracking-widest hover:bg-zinc-800 transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
            appPermission="home:write"
          >
            @if (isLoading) {
              <div
                class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"
              ></div>
              Guardando...
            } @else {
              Guardar nuevo plan <lucide-icon [img]="Plus" class="w-3 h-3"></lucide-icon>
            }
          </button>
        </div>
      </div>
    </div>
  </div>
}

<!-- Diálogo de Éxito Interno -->
@if (showSuccessDialog) {
  <div
    class="app-dialog-overlay fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-300"
  >
    <div
      class="bg-white rounded-[32px] p-8 max-w-sm w-full text-center space-y-4 shadow-2xl scale-100 animate-in zoom-in-95 duration-300"
    >
      <div
        class="w-16 h-16 bg-lime-100 text-lime-600 rounded-full flex items-center justify-center mx-auto"
      >
        <lucide-icon [img]="CheckCircle2" class="w-8 h-8"></lucide-icon>
      </div>
      <h3 class="text-xl font-black text-zinc-900 uppercase">¡Éxito!</h3>
      <p class="text-xs text-zinc-500 font-medium">{{ successMessage }}</p>
      <button
        (click)="finalizarExito()"
        class="w-full bg-zinc-950 text-white font-black py-3 rounded-2xl uppercase text-[10px] tracking-widest hover:bg-zinc-800 transition-all cursor-pointer"
      >
        Aceptar
      </button>
    </div>
  </div>
}
