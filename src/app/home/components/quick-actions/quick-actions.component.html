<div
  class="p-6 rounded-3xl shadow-xl space-y-6 flex flex-col justify-between border"
  style="background-color: var(--bg-secondary); border-color: var(--border-color)"
>
  <h3 class="text-xs font-black uppercase tracking-wider" style="color: var(--text-main)">
    Acciones rápidas
  </h3>

  <div class="grid grid-cols-3 gap-3">
    @for (action of actions(); track action.title) {
      <button
        (click)="actionClicked.emit(action.title)"
        class="p-4 rounded-2xl flex flex-col items-center justify-center gap-2.5 transition-all cursor-pointer group shadow-md border"
        style="background-color: var(--bg-primary); border-color: var(--border-color)"
      >
        <div
          class="w-10 h-10 rounded-xl flex items-center justify-center transition-transform group-hover:scale-110"
          [class]="action.colorClass"
        >
          <lucide-icon [img]="action.icon" class="w-5 h-5"></lucide-icon>
        </div>
        <span class="text-[11px] font-bold text-center" style="color: var(--text-main)">{{
          action.title
        }}</span>
      </button>
    }
  </div>

  <div
    class="border p-4 rounded-2xl flex items-center justify-between shadow-inner"
    style="background-color: var(--bg-primary); border-color: var(--border-color)"
  >
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-blue-500/20 text-blue-500 rounded-xl flex items-center justify-center">
        <lucide-icon [img]="Activity" class="w-5 h-5"></lucide-icon>
      </div>
      <div>
        <h4 class="text-xs font-bold" style="color: var(--text-main)">Sincroniza tu agenda</h4>
        <p class="text-[10px]" style="color: var(--text-muted)">
          Conecta tu calendario y recibe notificaciones en tiempo real.
        </p>
      </div>
    </div>
    <lucide-icon [img]="ChevronRight" class="w-4 h-4 text-blue-500"></lucide-icon>
  </div>
</div>
