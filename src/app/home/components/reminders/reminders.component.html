<div
  class="bg-[var(--bg-secondary)] border border-[var(--border-color)] p-6 rounded-3xl shadow-xl space-y-4 transition-colors duration-300 mb-6"
>
  <div class="flex justify-between items-center">
    <h3 class="text-xs font-black uppercase tracking-wider text-[var(--text-main)]">
      Reportes rápidos
    </h3>
    <span
      class="text-[10px] font-bold text-[var(--text-muted)] bg-[var(--bg-primary)] px-2.5 py-1 rounded-full border border-[var(--border-color)]"
      >General</span
    >
  </div>

  <div class="space-y-3">
    @for (report of reports(); track report.title) {
      <div
        (click)="onReportClick(report)"
        class="flex items-center justify-between p-3.5 rounded-2xl bg-[var(--bg-primary)] border border-[var(--border-color)] hover:border-[var(--accent-color)] transition-all cursor-pointer group"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 border transition-transform group-hover:scale-105"
            [class]="report.colorClass"
          >
            <lucide-icon [img]="report.icon" class="w-4 h-4"></lucide-icon>
          </div>
          <div>
            <h4
              class="text-xs font-bold text-[var(--text-main)] group-hover:text-[var(--accent-color)] transition-colors"
            >
              {{ report.title }}
            </h4>
            <p class="text-[10px] text-[var(--text-muted)] mt-0.5">{{ report.subtitle }}</p>
          </div>
        </div>
        <lucide-icon
          [img]="ChevronRight"
          class="w-4 h-4 text-[var(--text-muted)] group-hover:translate-x-0.5 transition-transform"
        ></lucide-icon>
      </div>
    }
  </div>
</div>
