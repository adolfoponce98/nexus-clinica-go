<div class="relative min-h-screen flex items-center justify-center bg-zinc-950 text-white font-sans overflow-hidden">
  <div class="absolute inset-0 z-0">
    <img
      src="assets/image.jpg"
      class="w-full h-full object-cover opacity-30 grayscale"
      alt="Gym Background"
    >
    <div class="absolute inset-0 bg-gradient-to-r from-zinc-950 via-transparent to-zinc-950"></div>
  </div>

  <main class="relative z-10 w-full max-w-6xl px-8 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">

    <section>
      <div class="flex items-center gap-2 mb-8">
     <img src="assets/logoh.png" class="h-8 object-contain grayscale" alt="Logo">
      </div>

      <h2 class="text-6xl font-black uppercase leading-tight mb-4">
        Mantente <br>
        <span class="text-amber-400 italic">en Movimiento.</span>
      </h2>

      <p class="text-zinc-400 max-w-md text-lg mb-8">
       Administra tu studio de Indoor o Gym y toma el control en todo un sistema completo de administración
      </p>

      <div class="flex gap-8 border-l-2 border-cyan-400 pl-6">
        <div>
          <p class="text-cyan-400 font-bold uppercase text-sm tracking-widest">En Línea</p>
          <p class="text-xs text-zinc-500 uppercase">Estatus</p>
        </div>

      </div>
    </section>

    <section class="flex justify-center lg:justify-end">
      <div class="w-full max-w-md bg-zinc-900/80 backdrop-blur-xl p-10 rounded-2xl border border-zinc-800 shadow-2xl">
        <h3 class="text-2xl font-bold mb-1">Credenciales de accesso</h3>
        <p class="text-zinc-500 text-sm mb-8">Ingresa las credenciales de tu Estudio.</p>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

  <div class="space-y-2">
    <label class="text-[10px] uppercase font-bold tracking-widest text-amber-400">Correo</label>
    <div class="relative">
      <lucide-icon [img]="User" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></lucide-icon>
      <input
        type="email"
        formControlName="email"
        placeholder="admin@spinpro.com"
        class="w-full bg-zinc-950 border border-zinc-800 rounded-lg py-3 pl-10 pr-4 text-white focus:ring-1 focus:ring-amber-400 outline-none"
      >
    </div>
  </div>

  <div class="space-y-2">
    <label class="text-[10px] uppercase font-bold tracking-widest text-rose-400">Contraseña</label>
    <div class="relative">
      <lucide-icon [img]="Lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></lucide-icon>
      <input
        type="password"
        formControlName="password"
        placeholder="••••••••"
        class="w-full bg-zinc-950 border border-zinc-800 rounded-lg py-3 pl-10 pr-4 text-white focus:ring-1 focus:ring-amber-400 outline-none"
      >
    </div>
  </div>

<button
  type="submit"
  [disabled]="isLoading() || loginForm.invalid"
  class="w-full bg-amber-400 hover:bg-amber-500 disabled:bg-zinc-700 text-zinc-950 font-black py-4 rounded-lg flex items-center justify-center gap-2 transition-all uppercase tracking-tighter cursor-pointer disabled:cursor-not-allowed"
>
  @if (!isLoading()) {
    Entrar <lucide-icon [img]="Zap" class="w-4 h-4 fill-current"></lucide-icon>
  } @else {
    <div class="flex items-center gap-2">
      <div class="w-5 h-5 border-2 border-zinc-950 border-t-transparent rounded-full animate-spin"></div>
      Cargando...
    </div>
  }
</button>
  <ng-template #loader>
    <div class="flex items-center gap-2">
      <div class="w-5 h-5 border-2 border-zinc-950 border-t-transparent rounded-full animate-spin"></div>
      Cargando...
    </div>
  </ng-template>

</form>
      </div>
    </section>
  </main>

  <footer class="absolute bottom-6 w-full px-8 flex justify-between items-end text-[10px] font-bold tracking-widest text-zinc-700 uppercase">
    <div>
      <p class="text-cyan-950">Powered by Nexus Ecosystem</p>
      <p>v1.0.0</p>
    </div>
    <div class="flex gap-4">
      <lucide-icon name="ShieldCheck" class="w-4 h-4"></lucide-icon>
      <lucide-icon name="Rss" class="w-4 h-4 text-rose-900"></lucide-icon>
    </div>
  </footer>
</div>
