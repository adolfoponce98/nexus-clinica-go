<div class="relative min-h-screen flex items-center justify-center bg-zinc-950 text-white font-sans overflow-hidden">
  <div class="absolute inset-0 z-0">
    <img
      src="assets/image.png"
      class="w-full h-full object-cover opacity-30 grayscale"
      alt="Gym Background"
    >
    <div class="absolute inset-0 bg-gradient-to-r from-zinc-950 via-transparent to-zinc-950"></div>
  </div>

  <main class="relative z-10 w-full max-w-6xl px-8 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">

    <section>
      <div class="flex items-center gap-2 mb-8">
       <lucide-icon [img]="Bike" class="text-rose-400 w-8 h-8"></lucide-icon>
        <h1 class="text-2xl font-black italic tracking-tighter uppercase">SpinPro Admin</h1>
      </div>

      <h2 class="text-6xl font-black uppercase leading-tight mb-4">
        Precision <br>
        <span class="text-rose-400 italic">In Motion.</span>
      </h2>

      <p class="text-zinc-400 max-w-md text-lg mb-8">
        Access the Kinetic Vault. Command your studio, monitor real-time performance, and drive the rhythm of every session.
      </p>

      <div class="flex gap-8 border-l-2 border-cyan-400 pl-6">
        <div>
          <p class="text-cyan-400 font-bold uppercase text-sm tracking-widest">Live</p>
          <p class="text-xs text-zinc-500 uppercase">Status</p>
        </div>
        <div>
          <p class="text-2xl font-bold">2.4k</p>
          <p class="text-xs text-zinc-500 uppercase tracking-widest">Active Users</p>
        </div>
      </div>
    </section>

    <section class="flex justify-center lg:justify-end">
      <div class="w-full max-w-md bg-zinc-900/80 backdrop-blur-xl p-10 rounded-2xl border border-zinc-800 shadow-2xl">
        <h3 class="text-2xl font-bold mb-1">Vault Access</h3>
        <p class="text-zinc-500 text-sm mb-8">Enter your credentials to manage the studio.</p>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

  <div class="space-y-2">
    <label class="text-[10px] uppercase font-bold tracking-widest text-rose-400">Email Address</label>
    <div class="relative">
      <lucide-icon [img]="User" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></lucide-icon>
      <input
        type="email"
        formControlName="email"
        placeholder="admin@spinpro.com"
        class="w-full bg-zinc-950 border border-zinc-800 rounded-lg py-3 pl-10 pr-4 text-white focus:ring-1 focus:ring-rose-400 outline-none"
      >
    </div>
  </div>

  <div class="space-y-2">
    <label class="text-[10px] uppercase font-bold tracking-widest text-rose-400">Password</label>
    <div class="relative">
      <lucide-icon [img]="Lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></lucide-icon>
      <input
        type="password"
        formControlName="password"
        placeholder="••••••••"
        class="w-full bg-zinc-950 border border-zinc-800 rounded-lg py-3 pl-10 pr-4 text-white focus:ring-1 focus:ring-rose-400 outline-none"
      >
    </div>
  </div>

  <button
    type="submit"
    [disabled]="isLoading() || loginForm.invalid"
    class="w-full bg-rose-400 hover:bg-rose-500 disabled:bg-zinc-700 text-zinc-950 font-black py-4 rounded-lg flex items-center justify-center gap-2 transition-all uppercase tracking-tighter"
  >
    <ng-container *NgIf="!isLoading(); else loader">
      Login <lucide-icon [img]="Zap" class="w-4 h-4 fill-current"></lucide-icon>
    </ng-container>
  </button>

  <ng-template #loader>
    <div class="flex items-center gap-2">
      <div class="w-5 h-5 border-2 border-zinc-950 border-t-transparent rounded-full animate-spin"></div>
      Processing...
    </div>
  </ng-template>

</form>
      </div>
    </section>
  </main>

  <footer class="absolute bottom-6 w-full px-8 flex justify-between items-end text-[10px] font-bold tracking-widest text-zinc-700 uppercase">
    <div>
      <p class="text-cyan-950">Kinetic Pulse OS</p>
      <p>v4.2.0 Build 2024</p>
    </div>
    <div class="flex gap-4">
      <lucide-icon name="ShieldCheck" class="w-4 h-4"></lucide-icon>
      <lucide-icon name="Rss" class="w-4 h-4 text-rose-900"></lucide-icon>
    </div>
  </footer>
</div>
