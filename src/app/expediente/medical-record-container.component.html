<div class="w-full h-full">
  @switch (currentSpecialtyCode) {
    <!-- Dentista -->
    @case ('DENT') {
      <app-medical-record-form-dentist></app-medical-record-form-dentist>
    }

    <!-- Oftalmología -->
    @case ('OFTA') {
      <app-oftalmologia></app-oftalmologia>
    }

    <!-- Traumatología y Ortopedia -->
    @case ('TRAUM') {
      <app-medical-record-form></app-medical-record-form>
    }

    <!-- Resto del catálogo o por defecto (GEN, PED, CAR, DER, GINE) -->
    @default {
      <app-medical-record-form></app-medical-record-form>
    }
  }
</div>
