@if (loading()) {
  <div class="p-4 sm:p-6">
    <app-clinical-page-skeleton
      kind="consultation"
      label="Preparando la nueva consulta y tu especialidad…"
    />
  </div>
} @else {
  @switch (currentSpecialtyCode) {
    @case ('GEN') {
      <app-general-followup />
    }
    @case ('GINE') {
      <app-gynecology-followup />
    }
    @case ('PED') {
      <app-pediatrics-followup />
    }
    @case ('TRAUM') {
      <app-medical-followup />
    }
    @case ('DER') {
      <app-dermatology-followup />
    }
    @case ('DENT') {
      <app-odontology-followup />
    }
    @case ('NUT') {
      <app-nutrition-followup />
    }
    @case ('PSI') {
      <app-psychology-followup />
    }
    @case ('FIS') {
      <app-physiotherapy-followup />
    }
    @case ('OFTA') {
      <app-ophthalmology-followup />
    }
    @default {
      <app-general-followup />
    }
  }
}
