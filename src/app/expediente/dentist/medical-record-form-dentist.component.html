<div class="min-h-screen bg-[var(--bg-primary)] text-[var(--text-main)] font-sans p-4 sm:p-5 space-y-4 max-w-full mx-auto transition-colors duration-300" [formGroup]="recordForm">
   <div>

      <h1 class="text-xl font-black tracking-tight text-[var(--text-main)] mt-0.5">Datos de nuevo Paciente</h1>
      <p class="text-xs text-[var(--text-muted)]">Completa la información general, antecedentes y el examen clínico intraoral.</p>
   </div>

  <!-- CONTENEDOR PRINCIPAL UNIFICADO (SIN PESTAÑAS) -->
  <div class="space-y-6">

    <!-- 1. DATOS PERSONALES / IDENTIFICACIÓN -->
    <div class="bg-[var(--bg-secondary)] border border-[var(--border-color)] p-5 sm:p-6 rounded-3xl shadow-xl">
      <app-patient-identification (savePatientData)="handleSavePatientData($event)"></app-patient-identification>
    </div>



  </div>

</div>

<!-- SPINNER GLOBAL / DIÁLOGO DE CARGA -->
@if (isLoading()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center backdrop-blur-md bg-black/50 animate-in fade-in duration-200">
    <div class="bg-[var(--bg-secondary)] border border-[var(--border-color)] p-6 rounded-3xl shadow-2xl flex flex-col items-center space-y-4 max-w-sm text-center">
      <lucide-icon [img]="icons.Loader2" class="w-10 h-10 text-teal-500 animate-spin"></lucide-icon>
      <div>
        <p class="text-sm font-black text-[var(--text-main)] uppercase tracking-wider">Guardando Expediente</p>
        <p class="text-xs text-[var(--text-muted)] mt-1">{{ loadingMessage() }}</p>
      </div>
    </div>
  </div>
}

<!-- DIÁLOGO MODAL DE ÉXITO -->
@if (showSuccessModal()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center backdrop-blur-md bg-black/60 animate-in fade-in duration-300 p-4">
    <div class="bg-[var(--bg-secondary)] border border-teal-500/40 p-6 sm:p-8 rounded-3xl shadow-2xl flex flex-col items-center space-y-4 max-w-md text-center">
      <div class="w-14 h-14 rounded-2xl bg-emerald-500/15 text-emerald-500 border border-emerald-500/30 flex items-center justify-center">
        <lucide-icon [img]="icons.CheckCircle" class="w-8 h-8"></lucide-icon>
      </div>
      <div class="space-y-1">
        <h3 class="text-base font-black text-[var(--text-main)] uppercase tracking-wider">¡Operación Exitosa!</h3>
        <p class="text-xs text-[var(--text-muted)] leading-relaxed">{{ successMessage() }}</p>
      </div>
      <button (click)="cerrarExitoYRedirigir()"
              class="w-full mt-2 py-3 px-6 rounded-2xl text-xs font-black bg-teal-600 hover:bg-teal-500 text-white shadow-lg shadow-teal-600/25 transition-all cursor-pointer">
        Aceptar y Volver al Expediente
      </button>
    </div>
  </div>
}
